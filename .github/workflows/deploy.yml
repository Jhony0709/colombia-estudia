name: Deploy

on:
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # ci.yml se llama con `workflow_call` y hereda estos permisos: los que pide a nivel de job
  # (el `security` pide pull-requests: read para gitleaks) solo pueden reducir, nunca ampliar.
  pull-requests: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate-staging:
    needs: ci
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}

  migrate-prod:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.HAS_PROD == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL_PROD }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PROD }}

  deploy-vercel:
    needs: [migrate-staging, migrate-prod]
    # Despliega solo si migró la base de su entorno: main → producción, develop → staging.
    if: >-
      ${{ !cancelled() && vars.DEPLOY_FROM_ACTIONS == 'true' &&
      ((github.ref == 'refs/heads/main' && needs.migrate-prod.result == 'success') ||
      (github.ref == 'refs/heads/develop' && needs.migrate-staging.result == 'success')) }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=$VERCEL_TARGET
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: npx vercel build --target=$VERCEL_TARGET
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy
        id: deploy
        run: |
          # vercel prints the deployment URL to stdout and the inspector URL to stderr:
          # keep them apart so the smoke test hits the deployment, not the dashboard.
          url=$(npx vercel deploy --prebuilt --target=$VERCEL_TARGET)
          echo "url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Smoke test
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/api/health")
          if [ "$status" != "200" ]; then
            echo "Health check failed with status $status"
            exit 1
          fi
